<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numerología del Ser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        @keyframes fade-in-up-sm {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fade-in-up-sm {
            animation: fade-in-up-sm 0.2s ease-out forwards;
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-right {
            from { transform: translateX(0); }
            to { transform: translateX(100%); }
        }
        @keyframes slide-in-left {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        @keyframes slide-out-left {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
        .animate-slide-in-right { animation: slide-in-right 0.3s forwards ease-in-out; }
        .animate-slide-out-right { animation: slide-out-right 0.3s forwards ease-in-out; }
        .animate-slide-in-left { animation: slide-in-left 0.3s forwards ease-in-out; }
        .animate-slide-out-left { animation: slide-out-left 0.3s forwards ease-in-out; }
        
        @keyframes fade-in-stagger {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-stagger {
            animation: fade-in-stagger 0.4s ease-out forwards;
        }


        @media print {
            body {
                background: #fff !important;
            }
            main > *:not(.printable-section) {
                display: none !important;
            }
            .printable-section {
                margin-top: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            /* Style adjustments for print media */
            .printable-section .bg-slate-800\/60,
            .printable-section .backdrop-blur-md,
            .printable-section .border,
            .printable-section .shadow-2xl {
                background: none !important;
                backdrop-filter: none !important;
                border: none !important;
                box-shadow: none !important;
            }
            .printable-section * {
                color: #000 !important;
                background-image: none !important; /* Removes gradients from text */
            }
            .printable-section h2, .printable-section h3, .printable-section p {
                color: #000 !important;
            }
            .printable-section .prose {
                max-width: 100% !important;
            }
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
